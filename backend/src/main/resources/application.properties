spring.application.name=databrew-backend
server.port=8080

aws.region=ap-south-1
aws.s3.bucket=sathwik-databrew-project-2026
aws.s3.upload-prefix=frontend-uploads/
aws.s3.output-prefix=frontend-cleaned/

aws.databrew.role-arn=arn:aws:iam::837111420564:role/DataBrewS3AccessRole
aws.databrew.recipe-name=customer-sales-cleaning-recipe
aws.databrew.recipe-version=1.0

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
